name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: build, test, publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
          scope: '@atom-circuit'

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Size limit
        run: npm run size

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Assemble release notes (SRI + changelog)
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HASH="sha384-$(openssl dgst -sha384 -binary dist/atom-circuit.iife.js | openssl base64 -A)"
          awk -v v="$VERSION" '
            /^## \[/ { if (seg) exit; if ($0 ~ "^## \\[" v "\\]") { seg=1; next } }
            seg { print }
          ' CHANGELOG.md > changelog-section.md
          {
            printf '## CDN integrity (Subresource Integrity)\n\n'
            printf 'SRI hash for `@atom-circuit/embed-sdk@%s/dist/atom-circuit.iife.js`:\n\n' "$VERSION"
            printf '```\n%s\n```\n\n' "$HASH"
            printf '```html\n<script src="https://unpkg.com/@atom-circuit/embed-sdk@%s/dist/atom-circuit.iife.js" integrity="%s" crossorigin="anonymous"></script>\n```\n\n' "$VERSION" "$HASH"
            printf -- '---\n\n'
            cat changelog-section.md
          } > release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          make_latest: true
